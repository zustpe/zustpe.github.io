<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <meta http-equiv="Cache-Control" content="no-store" />

    <script>
        (function () {

            const params = new URLSearchParams(window.location.search);

            const code = params.get("code");
            const state = params.get("state");

            if (!code || !state) {
                document.body.innerHTML =
                    "<h3>Missing code or state parameter.</h3>";
                return;
            }

            const stateValue = state.toLowerCase();

            let redirectBaseUrl = "";

            if (stateValue.startsWith("devkaamrade")) {
                redirectBaseUrl =
                    "https://dev.kaamrade.com/candidate/verifykyc";
            }
            else if (stateValue.startsWith("kaamrade")) {
                redirectBaseUrl =
                    "https://www.kaamrade.com/candidate/verifykyc";
            }
            else {
                document.body.innerHTML =
                    "<h3>Unknown state: " + state + "</h3>";
                return;
            }

            const redirectUrl =
                `${redirectBaseUrl}?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;

            console.log("Redirect URL:", redirectUrl);

            window.location.replace(redirectUrl);

        })();
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
