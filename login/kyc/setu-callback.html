<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <meta http-equiv="Cache-Control" content="no-store" />

    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);

                const code = params.get('code');
                const state = params.get('state');

                console.log('Received code:', code);
                console.log('Received state:', state);

                if (!code || !state) {
                    document.body.innerHTML =
                        '<h3>Invalid request. Missing code or state.</h3>';
                    return;
                }

                let targetBaseUrl = '';

                const stateValue = state.toLowerCase().trim();

                if (stateValue.includes('devkaamrade')) {
                    targetBaseUrl =
                        'https://dev.kaamrade.com/candidate/verifykyc';
                } else if (stateValue.includes('kaamrade')) {
                    targetBaseUrl =
                        'https://www.kaamrade.com/candidate/verifykyc';
                } else {
                    document.body.innerHTML =
                        '<h3>Unknown state: ' + state + '</h3>';
                    return;
                }

                const redirectUrl =
                    `${targetBaseUrl}?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;

                console.log('Redirecting to:', redirectUrl);

                window.location.href = redirectUrl;

            } catch (error) {
                console.error(error);

                document.body.innerHTML =
                    '<h3>An error occurred during redirection.</h3>';
            }
        })();
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
